<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TO DO LIST</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="JS/script.js" defer></script>
    <link rel="stylesheet" href="CSS/style.css" />
    <style>
      @font-face {
        font-family: "Roboto";
        src: url("assets/fonts/RobotoCondensed.ttf");
      }
    </style>
  </head>
  <body class="min-h-screen bg-gray-50 flex justify-center p-5 font-[Roboto]">
  <main class="w-full max-w-xl bg-white rounded-2xl shadow-md p-6 h-fit">
    <h1 class="text-3xl text-gray-800 mb-6">Lista de tarefas</h1>

    <form id="AddList" class="flex gap-3 mb-6">
      <input
        type="text"
        id="AddText"
        placeholder="Nova tarefa"
        class="flex-1 border border-gray-300 rounded-full px-4 py-2 outline-none focus:border-[#1a73e8] focus:ring-1 focus:ring-[#1a73e8]"
      >
      <button
        type="submit"
        class="bg-[#1a73e8] hover:bg-[#1765cc] text-white font-medium rounded-full px-5 py-2 cursor-pointer"
      >
        Adicionar
      </button>
    </form>

    <section id="section" class="hidden">
      <h2 class="text-sm font-medium text-gray-500 uppercase mb-3">Afazeres</h2>
      <ul id="Lista" class="divide-y divide-gray-200"></ul>
    </section>
  </main>
</body>
</html>
