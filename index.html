<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oportunidades</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="SCRIPTS/script.js" defer></script>
    <link rel="stylesheet" href="STYLES/style.css">
    <style>
        @font-face {
            font-family: 'Roboto';
            src: url('ASSETS/FONTS/RobotoCondensed.ttf');
        }
    </style>
</head>

<body class="bg-white text-gray-800 antialiased font-['Roboto',Arial,sans-serif]">
    <main class="min-h-screen grid justify-items-center p-[clamp(1.5rem,2.5vw,5rem)]">
        <section
            class="w-full px-3 lg:w-auto lg:px-0 grid justify-items-center content-start gap-y-[clamp(1rem,2vw,5rem)]">
            <h1 class="text-[clamp(1.5rem,3.5vw,10rem)] font-light tracking-tight text-gray-700 text-center">Agenda de
                Oportunidades</h1>
            <form id="AddList"
                class="w-full lg:w-0 lg:min-w-full flex flex-col items-center gap-[clamp(1rem,2vw,4rem)]">
                <div class="grid grid-cols-[1fr_1fr] grid-rows-[1fr_1fr] gap-[clamp(1rem,1.8vw,6rem)] items-center">

                    <label for="AddText" class="w-full flex flex-col gap-2 text-[clamp(1rem,1.3vw,4rem)] text-gray-500">
                        Oportunidade
                        <input type="text" id="AddText" autocomplete="off" required
                            class="w-full rounded-full border border-gray-200 bg-white p-[clamp(0.5rem,0.8vw,1.5rem)] text-[clamp(0.5rem,1vw,3.7rem)] font-normal text-gray-800 shadow-sm transition-shadow duration-200 hover:shadow-md focus:shadow-md focus:border-gray-300 focus:outline-none">
                    </label>
                    <label for="AddDescricao"
                        class="w-full flex flex-col gap-2 text-[clamp(1rem,1.3vw,4rem)] text-gray-500">
                        Descrição
                        <input type="text" id="AddDescricao" autocomplete="off" required
                            class="w-full rounded-full border border-gray-200 bg-white p-[clamp(0.5rem,0.8vw,1.5rem)] text-[clamp(0.5rem,1vw,3.7rem)] font-normal text-gray-800 shadow-sm transition-shadow duration-200 hover:shadow-md focus:shadow-md focus:border-gray-300 focus:outline-none">
                    </label>
                    <label for="AddCategoria"
                        class="w-full flex flex-col gap-2 text-[clamp(1rem,1.3vw,4rem)] text-gray-500">
                        Categoria
                        <select id="AddCategoria" autocomplete="off" required
                            class="w-full rounded-full border border-gray-200 bg-white p-[clamp(0.5rem,0.8vw,1.5rem)] text-[clamp(0.5rem,1vw,3.7rem)] font-normal text-gray-800 shadow-sm transition-shadow duration-200 hover:shadow-md focus:shadow-md focus:border-gray-300 focus:outline-none">
                            <option value="">Selecione uma categoria</option>
                            <option value="Geral">Geral</option>
                            <option value="Tecnologia">Tecnologia</option>
                            <option value="Negócios">Negócios</option>
                            <option value="Educação">Educação</option>
                        </select>
                    </label>
                    <label for="AddData" class="w-full flex flex-col gap-2 text-[clamp(1rem,1.3vw,4rem)] text-gray-500">
                        Data
                        <input type="date" id="AddData" autocomplete="off" required
                            class="w-full rounded-full border border-gray-200 bg-white p-[clamp(0.5rem,0.8vw,1.5rem)] text-[clamp(0.5rem,1vw,3.7rem)] font-normal text-gray-800 shadow-sm transition-shadow duration-200 hover:shadow-md focus:shadow-md focus:border-gray-300 focus:outline-none">
                    </label>
                </div>

                <input type="submit" value="Adicionar" id="submit"
                    class="cursor-pointer rounded-md border border-gray-100 bg-gray-50 p-[clamp(0.5rem,0.6vw,2rem)] text-[clamp(0.5rem,1vw,4rem)] font-medium text-gray-700 transition hover:border-gray-200 hover:bg-gray-100 hover:shadow-sm focus:outline-none">
            </form>

            <hr class="hidden w-full lg:w-0 lg:min-w-full border-t border-gray-200" id="linha">

            <section class="hidden w-full lg:w-0 lg:min-w-full justify-items-center" id="section">
                <h2 class="rounded-full border border-gray-200 bg-white px-6 py-2 text-[clamp(0.7rem,1vw,4rem)] font-medium text-gray-600 shadow-sm"
                    id="contador">Oportunidades</h2>
                <ul class="w-full py-8 grid gap-y-4" id="Lista"></ul>
            </section>
        </section>
    </main>
</body>

</html>
